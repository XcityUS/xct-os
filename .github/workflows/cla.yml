name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened,synchronize]
  merge_group:

permissions:
  actions: write
  contents: write # to store signatures on cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  CLAssistant:
    # Cloudflare's CLA covers contributions to the upstream repo only. On forks (like this one,
    # where upstream commits arrive wholesale via sync merges) the check would demand signatures
    # from upstream committers, so it only runs upstream — same guard as preview.yml.
    if: github.repository_owner == 'cloudflare'
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.issue.pull_request && (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')) || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://www.cloudflare.com/cla/'
          # branch should not be protected
          branch: 'cla-signatures'
          allowlist: dependabot[bot],workers-devprod,github-actions[bot]
          lock-pullrequest-aftermerge: false
